name: Build releases
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'scripts/package-release.py'
      - 'scripts/assemble-release.py'
      - 'scripts/build-appimage.py'
      - 'scripts/embed-cursors.py'
      - 'scripts/generate-icons.py'
      - 'scripts/verify-package-icons.py'
      - 'src/common/icon*'
      - 'src/key/**'
      - 'src/graphics/**'
      - 'src/common/engine_settings*'
      - 'textures/tilesets/**'
      - 'textures/cursors/**'
      - 'packaging/**'
      - 'tests/**'
  workflow_dispatch:
  # 02:23 Los Angeles is 09:23 UTC in summer and 10:23 in winter.
  schedule:
    - cron: '23 9 * * *'
    - cron: '23 10 * * *'
permissions:
  contents: read
# Serialize publication, including manual/tag runs; never cancel a build in flight.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.event.pull_request.number) || 'impera-release' }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      build: ${{ steps.detect.outputs.build }}
      sha: ${{ steps.detect.outputs.sha }}
      version: ${{ steps.detect.outputs.version }}
      automatic: ${{ steps.detect.outputs.automatic }}
    steps:
      - name: Detect unreleased default-branch commits
        id: detect
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          import datetime, json, os, subprocess
          from urllib.parse import quote
          from zoneinfo import ZoneInfo

          def api(path, *options):
              return json.loads(subprocess.check_output(['gh', 'api', path, *options], text=True))

          def output(**values):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                  for key, value in values.items():
                      print(f'{key}={value}', file=stream)

          event = os.environ['GITHUB_EVENT_NAME']
          automatic = event in ('schedule', 'workflow_dispatch')
          output(build='false', automatic=str(automatic).lower())
          if not automatic:
              output(build='true', sha=os.environ['GITHUB_SHA'], version=os.environ['GITHUB_REF_NAME'])
          else:
              now = datetime.datetime.now(ZoneInfo('America/Los_Angeles'))
              # Select the scheduled slot, rather than the runner's current
              # hour, so a delayed or queued job can still release that day.
              utc = now.astimezone(datetime.timezone.utc)
              slots = [utc.replace(hour=hour, minute=23, second=0, microsecond=0)
                       for hour in (9, 10)]
              slot = next((time for time in slots if time.astimezone(now.tzinfo).hour == 2), slots[1])
              # Spring-forward has no 02:23: use 03:23 on that one day.
              if event == 'schedule' and os.environ['SCHEDULE'] != f'23 {slot.hour} * * *':
                  print('Skipping the inactive daylight-saving schedule.')
              else:
                  repo = os.environ['GH_REPO']
                  branch = api(f'repos/{repo}')['default_branch']
                  sha = api(f'repos/{repo}/commits/{quote(branch, safe="")}')['sha']
                  pages = api(f'repos/{repo}/releases?per_page=100', '--paginate', '--slurp')
                  published = [release for page in pages for release in page
                               if not release['draft'] and release['published_at']]
                  latest = max(published, key=lambda release: release['published_at'], default=None)
                  changed = latest is None
                  if latest:
                      base = quote(latest['tag_name'], safe='')
                      changed = api(f'repos/{repo}/compare/{base}...{sha}')['ahead_by'] > 0
                  if changed:
                      version = f'v{now:%Y.%m.%d}-{sha[:12]}'
                      output(build='true', sha=sha, version=version)
                  else:
                      print('No unreleased default-branch commits; skipping builds and publication.')
  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Configure
        run: cmake -S . -B release-build -DCMAKE_BUILD_TYPE=Release -DIMPERA_BUNDLED_SDL=ON -DU5D_BUILD_TESTS=ON
      - name: Build
        run: cmake --build release-build --config Release --parallel 3
      - name: Tests
        run: ctest --test-dir release-build -C Release --output-on-failure
      - name: Embedded cursor consistency
        run: python scripts/embed-cursors.py --check
      - name: Generated icon consistency
        run: python scripts/generate-icons.py --check
      - name: Packaging regression
        run: python tests/test_package_release.py
      - name: Release rerun regression
        if: runner.os == 'Linux'
        run: |
          python -m pip install PyYAML==6.0.3
          python tests/test_release_workflow.py
      - name: Package
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/package-release.py --build release-build --platform ${{ matrix.platform }} ${{ runner.os == 'Windows' && '--unpacked' || '' }}
      - name: Windows and macOS package startup smoke check
        if: runner.os != 'Linux'
        shell: python
        run: |
          import os, pathlib, subprocess, tarfile, tempfile
          with tempfile.TemporaryDirectory() as temporary:
              runtime = pathlib.Path(temporary)
              if os.name == 'nt':
                  executable = next(pathlib.Path('dist').glob('*/Impera.exe')).resolve()
              else:
                  with tarfile.open(next(pathlib.Path('dist').glob('*.tar.gz'))) as archive:
                      archive.extractall(runtime, filter='data')
                  executable = next(runtime.glob('*/Impera.app/Contents/MacOS/Impera'))
              result = subprocess.run([str(executable), '--help'], cwd=runtime,
                                      capture_output=True, text=True, check=True,
                                      env={**os.environ, 'HOME': str(runtime)}, timeout=30)
              assert 'Usage: ultima5' in result.stdout, result.stdout + result.stderr
      - name: Verify packaged native icon
        if: runner.os != 'Linux'
        run: python scripts/verify-package-icons.py --platform ${{ matrix.platform }} --package-root dist
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: python scripts/build-appimage.py dist/*-linux-x86_64.tar.gz
      - name: AppImage startup smoke check
        if: runner.os == 'Linux'
        run: |
          XDG_DATA_HOME="$RUNNER_TEMP/impera-smoke" dist/*.AppImage --appimage-extract-and-run --help > "$RUNNER_TEMP/impera-help.txt"
          grep -q 'Usage: ultima5' "$RUNNER_TEMP/impera-help.txt"
      - name: Verify AppImage icon
        if: runner.os == 'Linux'
        run: python scripts/verify-package-icons.py --platform linux-x86_64 --package-root dist
      - name: Remove internal Linux archive
        if: runner.os == 'Linux'
        run: rm dist/*-linux-x86_64.tar.gz dist/*-linux-x86_64.tar.gz.sha256
      - name: Stage direct Windows download
        if: runner.os == 'Windows'
        shell: python
        run: |
          import pathlib, shutil
          shutil.move(str(next(pathlib.Path('dist').glob('Impera-*-windows-x86_64'))), 'windows-artifact')
      - uses: actions/upload-artifact@v4
        with:
          name: Impera-${{ matrix.platform }}
          path: ${{ runner.os == 'Windows' && 'windows-artifact/' || 'dist/*' }}
          if-no-files-found: error
  release:
    if: needs.prepare.outputs.build == 'true' && (needs.prepare.outputs.automatic == 'true' || startsWith(github.ref, 'refs/tags/v'))
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Impera-*
      - name: Assemble release downloads
        run: python scripts/assemble-release.py --artifacts artifacts --version "${{ needs.prepare.outputs.version }}"
      - name: Create or reuse release and replace assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          AUTOMATIC_RELEASE: ${{ needs.prepare.outputs.automatic }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "${AUTOMATIC_RELEASE:-false}" = true ]; then
              gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --draft --title "Impera $RELEASE_TAG" --generate-notes
            else
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "Impera $RELEASE_TAG" --generate-notes
            fi
          fi
          # Older draft runs included an internal Linux archive. Remove those
          # obsolete assets when rerunning this workflow on the same tag.
          for obsolete in "Impera-$RELEASE_TAG-linux-x86_64.tar.gz" "Impera-$RELEASE_TAG-linux-x86_64.tar.gz.sha256"; do
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$obsolete"; then
              gh release delete-asset "$RELEASE_TAG" "$obsolete" --yes
            fi
          done
          gh release upload "$RELEASE_TAG" dist/* --clobber
          # Publish only once every package has been attached successfully.
          if [ "${AUTOMATIC_RELEASE:-false}" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
