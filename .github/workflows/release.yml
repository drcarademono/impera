name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'workshop/**'
      - 'tests/**'
      - 'scripts/**'
      - 'textures/**'
      - 'packaging/**'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'workshop/**'
      - 'tests/**'
      - 'scripts/**'
      - 'textures/**'
      - 'packaging/**'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            qt_arch: linux_gcc_64
          - os: windows-2022
            platform: windows-x86_64
            qt_arch: win64_msvc2022_64
          - os: macos-15-intel
            platform: macos-x86_64
            qt_arch: clang_64
          - os: macos-15
            platform: macos-arm64
            qt_arch: clang_64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('test-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Linux Qt deployment dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libx11-xcb1 libxcb-xkb1 libfontconfig1
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Configure
        run: cmake -S . -B release-build -DCMAKE_BUILD_TYPE=Release -DIMPERA_BUNDLED_SDL=ON -DU5D_BUILD_TESTS=ON -DIMPERA_BUILD_WORKSHOP=ON -DIMPERA_WORKSHOP_DEPLOY_QT=ON
      - name: Build
        run: cmake --build release-build --config Release --parallel 3
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir release-build -C Release --output-on-failure
      - name: Native executable startup
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
          QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES: '1'
        run: |
          import os, pathlib, subprocess
          build = pathlib.Path('release-build')
          if os.name == 'nt':
              engine = build / 'Release/Impera.exe'
              workshop = build / 'workshop/Release/ImperaWorkshop.exe'
          elif '${{ runner.os }}' == 'macOS':
              engine = build / 'Impera'
              workshop = build / 'workshop/ImperaWorkshop.app/Contents/MacOS/ImperaWorkshop'
          else:
              engine = build / 'Impera'
              workshop = build / 'workshop/ImperaWorkshop'
          for executable in (engine, workshop):
              print(f'Checking {executable}', flush=True)
              try:
                  result = subprocess.run([str(executable.resolve()), '--help'], check=True,
                                          capture_output=True, text=True, timeout=30)
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as error:
                  print(error.stdout or '', error.stderr or '')
                  raise
              print(result.stdout, end='')
              print(result.stderr, end='')
              assert 'Usage:' in result.stdout, result.stdout + result.stderr
      - name: Embedded asset consistency
        run: |
          python scripts/embed-cursors.py --check
          python scripts/embed-tilesets.py --check
          python scripts/test_embed_tilesets.py
      - name: Generated icon consistency
        run: python scripts/generate-icons.py --check
      - name: Packaging regression
        run: python tests/test_package_release.py
      - name: Release rerun regression
        if: runner.os == 'Linux'
        run: |
          python -m pip install PyYAML==6.0.3
          python tests/test_release_workflow.py
          python tests/test_workshop_release.py
      - name: Package
        run: python scripts/package-release.py --build release-build --platform ${{ matrix.platform }} ${{ runner.os == 'Windows' && '--unpacked' || '' }}
      - name: Windows and macOS package startup smoke check
        if: runner.os != 'Linux'
        shell: python
        run: |
          import os, pathlib, subprocess, tarfile, tempfile
          with tempfile.TemporaryDirectory() as temporary:
              runtime = pathlib.Path(temporary)
              if os.name == 'nt':
                  executable = next(pathlib.Path('dist').glob('*/Impera.exe')).resolve()
              else:
                  with tarfile.open(next(pathlib.Path('dist').glob('*.tar.gz'))) as archive:
                      archive.extractall(runtime, filter='data')
                  executable = next(runtime.glob('*/Impera.app/Contents/MacOS/Impera'))
              result = subprocess.run([str(executable), '--help'], cwd=runtime,
                                      capture_output=True, text=True, check=True,
                                      env={**os.environ, 'HOME': str(runtime)}, timeout=30)
              assert 'Usage: Impera' in result.stdout, result.stdout + result.stderr
      - name: Verify packaged native icon
        if: runner.os != 'Linux'
        run: python scripts/verify-package-icons.py --platform ${{ matrix.platform }} --package-root dist
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: python scripts/build-appimage.py dist/*-linux-x86_64.tar.gz
      - name: AppImage startup smoke check
        if: runner.os == 'Linux'
        run: |
          XDG_DATA_HOME="$RUNNER_TEMP/impera-smoke" dist/*.AppImage --appimage-extract-and-run --help > "$RUNNER_TEMP/impera-help.txt"
          grep -q 'Usage: Impera' "$RUNNER_TEMP/impera-help.txt"
      - name: Verify AppImage icon
        if: runner.os == 'Linux'
        run: python scripts/verify-package-icons.py --platform linux-x86_64 --package-root dist
      - name: Remove internal Linux archive
        if: runner.os == 'Linux'
        run: rm dist/*-linux-x86_64.tar.gz dist/*-linux-x86_64.tar.gz.sha256
      - name: Stage direct Windows download
        if: runner.os == 'Windows'
        shell: python
        run: |
          import pathlib, shutil
          shutil.move(str(next(pathlib.Path('dist').glob('Impera-*-windows-x86_64'))), 'windows-artifact')
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Impera-${{ matrix.platform }}
          path: ${{ runner.os == 'Windows' && 'windows-artifact/' || 'dist/*' }}
          if-no-files-found: error
      - name: Package Workshop with Qt runtime
        run: python scripts/package-workshop.py --build release-build/workshop --platform ${{ matrix.platform }}
      - name: Workshop package startup smoke check
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          import os, pathlib, subprocess, tarfile, tempfile
          with tempfile.TemporaryDirectory() as temporary:
              runtime = pathlib.Path(temporary)
              if os.name == 'nt':
                  executable = next(pathlib.Path('workshop-dist').glob('*/bin/ImperaWorkshop.exe')).resolve()
                  command = [str(executable), '--playtest-smoke-test']
              elif '${{ runner.os }}' == 'macOS':
                  with tarfile.open(next(pathlib.Path('workshop-dist').glob('*.tar.gz'))) as archive:
                      archive.extractall(runtime, filter='data')
                  executable = next(runtime.glob('*/ImperaWorkshop.app/Contents/MacOS/ImperaWorkshop'))
                  command = [str(executable), '--playtest-smoke-test']
              else:
                  executable = next(pathlib.Path('workshop-dist').glob('*.AppImage')).resolve()
                  command = [str(executable), '--appimage-extract-and-run', '--playtest-smoke-test']
              # Do not let the SDK's environment hide missing packaged dependencies.
              env = {k: v for k, v in os.environ.items() if k not in
                     {'LD_LIBRARY_PATH', 'DYLD_LIBRARY_PATH', 'DYLD_FRAMEWORK_PATH',
                      'QT_PLUGIN_PATH', 'QT_QPA_PLATFORM_PLUGIN_PATH'}}
              if os.name == 'nt':
                  env['PATH'] = os.pathsep.join(p for p in env['PATH'].split(os.pathsep)
                                              if 'qt' not in p.lower())
              try:
                  result = subprocess.run(command, cwd=runtime, env=env,
                                          capture_output=True, text=True, timeout=60)
              except subprocess.TimeoutExpired as error:
                  print(error.stdout or '', error.stderr or '', flush=True)
                  raise
              print(result.stdout, end='')
              print(result.stderr, end='')
              result.check_returncode()
              assert 'PASS native dialogue packaged smoke test' in result.stdout, result.stdout + result.stderr
      - name: Verify Workshop native icon
        run: python scripts/verify-package-icons.py --workshop --platform ${{ matrix.platform }} --package-root workshop-dist
      - name: Stage direct Windows Workshop download
        if: runner.os == 'Windows'
        shell: python
        run: |
          import pathlib, shutil
          shutil.move(str(next(pathlib.Path('workshop-dist').glob('ImperaWorkshop-*'))), 'workshop-windows-artifact')
      - name: Combined distribution startup smoke check
        run: python scripts/check-combined-release.py --platform ${{ matrix.platform }} --output build-artifacts
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: Impera-Workshop-${{ matrix.platform }}
          path: ${{ runner.os == 'Windows' && 'workshop-windows-artifact/' || 'workshop-dist/*' }}
          if-no-files-found: error
      - name: Upload testing packages
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.platform }}
          path: build-artifacts/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Impera-*
      - name: Assemble release downloads
        run: python scripts/assemble-release.py --artifacts artifacts --with-workshop --version "${{ github.ref_name }}"
      - name: Create or reuse release and replace assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Impera $RELEASE_TAG" --generate-notes
          fi
          # Replace the old separate-product downloads with combined archives.
          for obsolete in "Impera-$RELEASE_TAG-linux-x86_64.AppImage" "Impera-$RELEASE_TAG-linux-x86_64.AppImage.sha256" "ImperaWorkshop-$RELEASE_TAG-linux-x86_64.AppImage" "ImperaWorkshop-$RELEASE_TAG-linux-x86_64.AppImage.sha256" "ImperaWorkshop-$RELEASE_TAG-windows-x86_64.zip" "ImperaWorkshop-$RELEASE_TAG-windows-x86_64.zip.sha256" "ImperaWorkshop-$RELEASE_TAG-macos-x86_64.tar.gz" "ImperaWorkshop-$RELEASE_TAG-macos-x86_64.tar.gz.sha256" "ImperaWorkshop-$RELEASE_TAG-macos-arm64.tar.gz" "ImperaWorkshop-$RELEASE_TAG-macos-arm64.tar.gz.sha256"; do
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$obsolete"; then
              gh release delete-asset "$RELEASE_TAG" "$obsolete" --yes
            fi
          done
          gh release upload "$RELEASE_TAG" dist/* --clobber
