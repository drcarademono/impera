name: Build releases
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'scripts/package-release.py'
      - 'scripts/build-appimage.py'
      - 'scripts/embed-cursors.py'
      - 'src/key/**'
      - 'textures/cursors/**'
      - 'packaging/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Configure
        run: cmake -S . -B release-build -DCMAKE_BUILD_TYPE=Release -DIMPERA_BUNDLED_SDL=ON -DU5D_BUILD_TESTS=ON
      - name: Build
        run: cmake --build release-build --config Release --parallel 3
      - name: Tests
        run: ctest --test-dir release-build -C Release --output-on-failure
      - name: Embedded cursor consistency
        run: python scripts/embed-cursors.py --check
      - name: Packaging regression
        run: python tests/test_package_release.py
      - name: Package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/package-release.py --build release-build --platform ${{ matrix.platform }}
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: python scripts/build-appimage.py dist/*-linux-x86_64.tar.gz
      - name: AppImage startup smoke check
        if: runner.os == 'Linux'
        run: |
          XDG_DATA_HOME="$RUNNER_TEMP/impera-smoke" dist/*.AppImage --appimage-extract-and-run --help > "$RUNNER_TEMP/impera-help.txt"
          grep -q 'Usage: ultima5' "$RUNNER_TEMP/impera-help.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Impera-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Impera $RELEASE_TAG" --generate-notes
          elif [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "Refusing to replace assets on an already published release." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
